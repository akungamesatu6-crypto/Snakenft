name: temp-rename-index
on:
  push:
    paths:
      - '.github/workflows/temp-rename-index.yml'
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename preview to index
        run: |
          git config user.name "akungamesatu6-crypto"
          git config user.email "akungamesatu6@gmail.com"
          git mv preview-snakeagentnft.html index.html
          git commit -m "SnakeAgentNFT: hamburger + X post card + i18n + live status + rarity stock"
          git push
